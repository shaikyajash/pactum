[package]
name = "pactum-solana"
description = "Solana HTLC program for Pactum cross-chain swaps"
version = "0.1.0"
edition = "2021"
# platform-tools v1.48 ships Rust/Cargo 1.84; keep dependencies resolvable there
rust-version = "1.84"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "2.2"

[profile.release]
overflow-checks = true

[features]
no-entrypoint = []

# standalone: built with cargo-build-sbf, not part of the host workspace
[workspace]
